services:
  docgenie:
    build: .
    container_name: docgenie
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  chroma_data:
