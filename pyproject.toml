[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "docgenie"
version = "1.0.0"
description = "Self-hosted RAG chatbot for document Q&A. Upload documents and ask questions via a REST API."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "chromadb==0.4.18",
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "httpx==0.25.1",
    "requests==2.32.5",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.0.2",
    "langchain-google-genai>=1.0.0",
    "langchain-cohere>=0.1.0",
    "langchain-chroma>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/NaniBer/docgenie"
Source = "https://github.com/NaniBer/docgenie"
